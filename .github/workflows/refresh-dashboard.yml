name: Refresh LaLiga dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-dashboard.yml'
      - 'README.md'
      - 'fetch_official_laliga.py'
      - 'capture_official_standings.py'
      - 'capture_espn_laliga.py'
      - 'validate_laliga.py'
      - 'build_laliga_dashboard.py'
      - 'requirements.txt'
  schedule:
    # GitHub cron uses UTC; this is 06:10 America/Sao_Paulo.
    - cron: '10 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laliga-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the existing dashboard repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install official-source fetch dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Set Sao Paulo validation cutoff
        run: echo "LALIGA_CUTOFF=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M America/Sao_Paulo')" >> "$GITHUB_ENV"
      - name: Fetch official matchdays and current table
        run: |
          python3 fetch_official_laliga.py
          python3 capture_official_standings.py
      - name: Cross-check every FullTime score and independently recompute the ESPN table
        run: python3 capture_espn_laliga.py
      - name: Validate official and independent sources
        run: python3 validate_laliga.py
      - name: Build the existing static page
        run: python3 build_laliga_dashboard.py
      - name: Confirm count, cutoff and both source checks are embedded
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          report=json.loads(Path('laliga_2026_27_validation.json').read_text())
          espn=json.loads(Path('laliga_2026_27_espn_crosscheck.json').read_text())
          with Path('laliga_2026_27_matches_official.csv').open(encoding='utf-8-sig',newline='') as f:
              count=sum(r['status']=='finished' for r in csv.DictReader(f))
          page=Path('index.html').read_text()
          assert report['official_table_comparison']['all_stats_and_positions_match'] is True
          assert espn['result']=='PASS' and espn['official_final_scores']==count
          assert espn['exact_STATUS_FULL_TIME_matches']==count
          assert f'{count} jogos com resultado final verificado' in page
          assert report['cutoff'] in page
          PY
      - name: Commit only validated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/refresh-dashboard.yml \
            capture_espn_laliga.py validate_laliga.py build_laliga_dashboard.py \
            laliga_2026_27_matches_official.csv laliga_2026_27_official_table_snapshot.csv \
            laliga_2026_27_official_zones.json espn_2026_27_standings_snapshot.csv \
            laliga_2026_27_espn_result_crosscheck.csv laliga_2026_27_espn_crosscheck.json \
            laliga_2026_27_standings_computed.csv laliga_2026_27_validation.json \
            laliga_2026_27_validation.txt index.html
          if git diff --cached --quiet; then
            echo 'No validated dashboard changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh LaLiga dashboard after source validation'
          git push
